appId: video.openreel.desktop
productName: OpenReel
# Predictable, space-free, arch-suffixed names → clean R2 URLs + a simple
# manifest (e.g. OpenReel-1.2.3-arm64.dmg, OpenReel-1.2.3-x64.exe).
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
# The MCP stdio shim must be a real on-disk file so external clients (Claude
# Desktop / Cursor / Cline) can spawn it with `node`; unpack it from the asar.
asarUnpack:
  - dist/mcp-shim/**
directories:
  output: release
# Update feed for electron-updater. Builds embed app-update.yml pointing at the
# R2-backed download subdomain and generate latest*.yml + blockmaps; the release
# CI uploads everything to R2 (the generic provider does not upload itself).
publish:
  provider: generic
  url: https://dl.openreel.video
  channel: latest
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/plughost
    to: plughost
    filter:
      - "**/*"
  - from: resources/vst3host
    to: vst3host
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/samples
    to: samples
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
# File associations: OpenReel projects (.oreel) and the caption formats the editor imports. macOS gets
# CFBundleDocumentTypes (rank Alternate for captions: never take .srt over from the user's other apps) and an
# exported type for .oreel; NSIS registers the extensions; Linux gets a MimeType in the desktop entry and the
# shared-mime-info rules electron-builder generates. The list is generated from src/shared/file-associations.ts
# and checked against it by test/file-associations.test.ts.
fileAssociations:
  - ext: oreel
    name: OpenReel Project
    description: OpenReel project
    role: Editor
    rank: Owner
    mimeType: application/vnd.openreel.project+json
  - ext: srt
    name: SubRip Captions
    description: SubRip (.srt) captions
    role: Viewer
    rank: Alternate
    mimeType: application/x-subrip
  - ext: vtt
    name: WebVTT Captions
    description: WebVTT captions
    role: Viewer
    rank: Alternate
    mimeType: text/vtt
  - ext: scc
    name: Scenarist Closed Captions
    description: SCC closed captions
    role: Viewer
    rank: Alternate
    mimeType: text/x-scc
  - ext: mcc
    name: MacCaption Closed Captions
    description: MCC closed captions
    role: Viewer
    rank: Alternate
    mimeType: text/x-mcc
  - ext: stl
    name: EBU STL Subtitles
    description: EBU STL subtitles
    role: Viewer
    rank: Alternate
    mimeType: application/x-ebu-stl
  - ext: ttml
    name: TTML Captions
    description: TTML timed text captions
    role: Viewer
    rank: Alternate
    mimeType: application/ttml+xml
  - ext: dfxp
    name: DFXP Captions
    description: DFXP timed text captions
    role: Viewer
    rank: Alternate
    mimeType: application/ttaf+xml
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Without these the hardened runtime blocks the microphone silently (voice-over, webcam recording).
  extendInfo:
    NSMicrophoneUsageDescription: OpenReel uses the microphone to record voice-overs and narration into your project.
    NSCameraUsageDescription: OpenReel uses the camera to record webcam clips into your project.
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: video.openreel.project
        UTTypeDescription: OpenReel project
        UTTypeConformsTo:
          - public.json
          - public.data
        UTTypeTagSpecification:
          public.filename-extension:
            - oreel
          public.mime-type:
            - application/vnd.openreel.project+json
  # .oreel is a type of our own: declare it so Launch Services knows its name and that it is JSON text.
  # (Added to Info.plist next to the NSMicrophone keys above; CFBundleDocumentTypes comes from fileAssociations.)
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Sign downloadable (non-App-Store) builds with the Developer ID Application
  # cert present in this team's keychain. `pnpm pack` (--dir) skips signing.
  # electron-builder adds the "Developer ID Application:" prefix itself — supply
  # only the common name (name + Team ID) or it errors on the duplicate prefix.
  identity: "Augustus Otu (864H636QW4)"
  # Notarization runs on `pnpm dist`. teamId is set here; credentials come from
  # env at build time: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD (or APPLE_API_KEY +
  # APPLE_API_KEY_ID + APPLE_API_ISSUER). See apps/desktop/DISTRIBUTION.md.
  notarize:
    teamId: "864H636QW4"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
