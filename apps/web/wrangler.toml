name = "openreel"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Cloudflare Pages configuration for OpenReel video editor
# This app requires special headers for SharedArrayBuffer (used by FFmpeg.wasm)
# Custom domains:
# - app.openreel.video opens the standard video editor flow
# - motion.openreel.video currently falls back to the standard editor while
#   Motion Creator is disabled in the web app feature configuration

[env.production]
name = "openreel"

[env.preview]
name = "openreel-preview"
